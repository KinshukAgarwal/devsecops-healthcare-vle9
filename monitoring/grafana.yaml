apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-provisioning, namespace: monitoring }
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - { name: Prometheus, uid: prom, type: prometheus, access: proxy, url: "http://prometheus.monitoring.svc:9090", isDefault: true }
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - { name: healthcare, folder: DevSecOps, type: file, options: { path: /etc/grafana/dashboards } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-dashboards, namespace: monitoring }
data:
  healthcare-security.json: |
    {
     "uid": "healthcare-sec",
     "title": "Healthcare App Security",
     "tags": [
      "vle9",
      "devsecops"
     ],
     "timezone": "utc",
     "schemaVersion": 39,
     "refresh": "10s",
     "time": {
      "from": "now-30m",
      "to": "now"
     },
     "panels": [
      {
       "id": 1,
       "type": "stat",
       "title": "Firing alerts",
       "datasource": {
        "type": "prometheus",
        "uid": "prom"
       },
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "color": {
          "mode": "fixed",
          "fixedColor": "red"
         }
        },
        "overrides": []
       },
       "options": {
        "colorMode": "background",
        "graphMode": "none",
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        }
       },
       "targets": [
        {
         "refId": "A",
         "expr": "count(ALERTS{alertstate=\"firing\"}) or vector(0)",
         "datasource": {
          "type": "prometheus",
          "uid": "prom"
         }
        }
       ]
      },
      {
       "id": 2,
       "type": "stat",
       "title": "Failed logins (total)",
       "datasource": {
        "type": "prometheus",
        "uid": "prom"
       },
       "gridPos": {
        "x": 6,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "color": {
          "mode": "fixed",
          "fixedColor": "orange"
         }
        },
        "overrides": []
       },
       "options": {
        "colorMode": "background",
        "graphMode": "none",
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        }
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum(failed_login_total) or vector(0)",
         "datasource": {
          "type": "prometheus",
          "uid": "prom"
         }
        }
       ]
      },
      {
       "id": 3,
       "type": "stat",
       "title": "401/403 responses (total)",
       "datasource": {
        "type": "prometheus",
        "uid": "prom"
       },
       "gridPos": {
        "x": 12,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "color": {
          "mode": "fixed",
          "fixedColor": "purple"
         }
        },
        "overrides": []
       },
       "options": {
        "colorMode": "background",
        "graphMode": "none",
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        }
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum(http_requests_total{status=~\"401|403\"}) or vector(0)",
         "datasource": {
          "type": "prometheus",
          "uid": "prom"
         }
        }
       ]
      },
      {
       "id": 4,
       "type": "stat",
       "title": "App pods up",
       "datasource": {
        "type": "prometheus",
        "uid": "prom"
       },
       "gridPos": {
        "x": 18,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "color": {
          "mode": "fixed",
          "fixedColor": "green"
         }
        },
        "overrides": []
       },
       "options": {
        "colorMode": "background",
        "graphMode": "none",
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        }
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum(up{job=\"healthcare-app\"})",
         "datasource": {
          "type": "prometheus",
          "uid": "prom"
         }
        }
       ]
      },
      {
       "id": 5,
       "type": "timeseries",
       "title": "Failed logins per minute (by reason)",
       "datasource": {
        "type": "prometheus",
        "uid": "prom"
       },
       "gridPos": {
        "x": 0,
        "y": 4,
        "w": 12,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "list",
         "placement": "bottom"
        }
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (reason) (rate(failed_login_total[1m])) * 60",
         "legendFormat": "{{reason}}",
         "datasource": {
          "type": "prometheus",
          "uid": "prom"
         }
        }
       ]
      },
      {
       "id": 6,
       "type": "timeseries",
       "title": "Unauthorized (401/403) per minute",
       "datasource": {
        "type": "prometheus",
        "uid": "prom"
       },
       "gridPos": {
        "x": 12,
        "y": 4,
        "w": 12,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "list",
         "placement": "bottom"
        }
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (route, status) (rate(http_requests_total{status=~\"401|403\"}[1m])) * 60",
         "legendFormat": "{{status}} {{route}}",
         "datasource": {
          "type": "prometheus",
          "uid": "prom"
         }
        }
       ]
      },
      {
       "id": 7,
       "type": "timeseries",
       "title": "Request rate by status (req/s)",
       "datasource": {
        "type": "prometheus",
        "uid": "prom"
       },
       "gridPos": {
        "x": 0,
        "y": 12,
        "w": 12,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "list",
         "placement": "bottom"
        }
       },
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (status) (rate(http_requests_total[1m]))",
         "legendFormat": "{{status}}",
         "datasource": {
          "type": "prometheus",
          "uid": "prom"
         }
        }
       ]
      },
      {
       "id": 8,
       "type": "timeseries",
       "title": "CPU per pod (cores)",
       "datasource": {
        "type": "prometheus",
        "uid": "prom"
       },
       "gridPos": {
        "x": 12,
        "y": 12,
        "w": 12,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "list",
         "placement": "bottom"
        }
       },
       "targets": [
        {
         "refId": "A",
         "expr": "rate(process_cpu_seconds_total{job=\"healthcare-app\"}[1m])",
         "legendFormat": "{{pod}}",
         "datasource": {
          "type": "prometheus",
          "uid": "prom"
         }
        }
       ]
      },
      {
       "id": 9,
       "type": "timeseries",
       "title": "p95 latency",
       "datasource": {
        "type": "prometheus",
        "uid": "prom"
       },
       "gridPos": {
        "x": 0,
        "y": 20,
        "w": 12,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "s",
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "list",
         "placement": "bottom"
        }
       },
       "targets": [
        {
         "refId": "A",
         "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[1m])))",
         "legendFormat": "p95",
         "datasource": {
          "type": "prometheus",
          "uid": "prom"
         }
        }
       ]
      },
      {
       "id": 10,
       "type": "timeseries",
       "title": "Memory RSS per pod",
       "datasource": {
        "type": "prometheus",
        "uid": "prom"
       },
       "gridPos": {
        "x": 12,
        "y": 20,
        "w": 12,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "bytes",
         "custom": {
          "lineWidth": 2,
          "fillOpacity": 10
         }
        },
        "overrides": []
       },
       "options": {
        "legend": {
         "displayMode": "list",
         "placement": "bottom"
        }
       },
       "targets": [
        {
         "refId": "A",
         "expr": "process_resident_memory_bytes{job=\"healthcare-app\"}",
         "legendFormat": "{{pod}}",
         "datasource": {
          "type": "prometheus",
          "uid": "prom"
         }
        }
       ]
      }
     ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: monitoring }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 472, fsGroup: 472, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          ports: [{ containerPort: 3000 }]
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - name: GF_SECURITY_ADMIN_PASSWORD          # from a Secret, generated on the server
              valueFrom: { secretKeyRef: { name: grafana-admin, key: admin-password } }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
            - { name: GF_NEWS_NEWS_FEED_ENABLED, value: "false" }
            - { name: GF_PATHS_PROVISIONING, value: /etc/grafana/provisioning }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { cpu: 500m, memory: 256Mi } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
            - { name: tmp, mountPath: /tmp }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml }
            - { name: dashboards, mountPath: /etc/grafana/dashboards }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - { name: provisioning, configMap: { name: grafana-provisioning } }
        - { name: dashboards, configMap: { name: grafana-dashboards } }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: monitoring }
spec:
  type: NodePort
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000, nodePort: 30300 }]
